<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Raasta 3D</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="brand">Raasta 3D <span id="fps">-- fps</span></div>
  <div id="pos"></div>
</div>
<div id="crosshair"></div>

<div id="overlay">
  <div class="card">
    <h1>Raasta 3D</h1>
    <p id="status">Loading the 3D lab...</p>
    <div id="bar"><div id="barfill"></div></div>
    <button id="enter" disabled>Click to walk</button>
    <ul class="keys">
      <li><b>W A S D</b> move</li>
      <li><b>Mouse</b> look around</li>
      <li><b>Shift</b> walk faster</li>
      <li><b>Esc</b> release mouse</li>
    </ul>
    <p class="small">On a phone: drag to look, hold the arrows to walk.</p>
  </div>
</div>

<div id="touch">
  <button data-move="fwd" aria-label="Walk forward">&#9650;</button>
  <button data-move="back" aria-label="Walk back">&#9660;</button>
</div>

<div id="tune" hidden>
  <h2>Calibrate</h2>
  <label>Rotate X <input type="range" id="rx" min="-180" max="180" step="1"><span></span></label>
  <label>Rotate Y <input type="range" id="ry" min="-180" max="180" step="1"><span></span></label>
  <label>Rotate Z <input type="range" id="rz" min="-180" max="180" step="1"><span></span></label>
  <label>Scale <input type="range" id="sc" min="0.1" max="10" step="0.05"><span></span></label>
  <label>Model height <input type="range" id="py" min="-10" max="10" step="0.05"><span></span></label>
  <label>Eye height <input type="range" id="eh" min="0.5" max="3" step="0.05"><span></span></label>
  <label>Near clip <input type="range" id="nc" min="0.02" max="1.5" step="0.01"><span></span></label>
  <label>Field of view <input type="range" id="fv" min="40" max="90" step="1"><span></span></label>
  <div class="row">
    <button id="setMin">Bound corner A = here</button>
    <button id="setMax">Bound corner B = here</button>
  </div>
  <div class="row">
    <button id="setStart">Start point = here</button>
    <button id="noBounds">Toggle bounds</button>
  </div>
  <button id="copy">Show config.json</button>
  <textarea id="out" readonly></textarea>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
